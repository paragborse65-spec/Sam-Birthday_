<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sam 🎂</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow-x:hidden;
  font-family:Georgia, "Times New Roman", serif;
  background:linear-gradient(135deg,#fff1f7,#f7efff,#fff8e7);
  color:#4a2847; text-align:center;
}
.container{min-height:100vh;padding:55px 18px 70px;position:relative;overflow:hidden}
h1{font-size:clamp(38px,10vw,78px);margin:18px 0 8px;letter-spacing:2px;
    text-shadow:0 4px 14px rgba(80,30,80,.18)}
.subtitle{font-size:clamp(17px,4vw,25px);margin-bottom:28px}
.card{
  max-width:720px;margin:auto;padding:20px;border-radius:30px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
  box-shadow:0 18px 50px rgba(80,40,90,.18);
}
.photo{width:min(88vw,520px);max-height:620px;object-fit:cover;border-radius:24px;
       box-shadow:0 12px 35px rgba(0,0,0,.2)}
.wish{font-size:clamp(18px,4.5vw,26px);line-height:1.6;margin:25px auto 5px;max-width:600px}
.stickers{font-size:40px;letter-spacing:10px;margin:22px 0;animation:float 3s ease-in-out infinite}
.footer{margin-top:28px;font-size:14px;opacity:.65}
.balloon{position:absolute;font-size:48px;animation:rise 9s linear infinite;opacity:.8}
.b1{left:6%;bottom:-80px;animation-delay:0s} .b2{right:7%;bottom:-90px;animation-delay:2s}
.b3{left:25%;bottom:-100px;animation-delay:4s} .b4{right:25%;bottom:-100px;animation-delay:6s}
.confetti{position:absolute;inset:0;pointer-events:none;background-image:
radial-gradient(circle at 10% 20%,#f66 0 4px,transparent 5px),
radial-gradient(circle at 85% 25%,#6cf 0 4px,transparent 5px),
radial-gradient(circle at 20% 80%,#fc6 0 4px,transparent 5px),
radial-gradient(circle at 75% 75%,#9f6 0 4px,transparent 5px),
radial-gradient(circle at 50% 10%,#c9f 0 4px,transparent 5px);
animation:twinkle 2.5s ease-in-out infinite alternate}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
@media(max-width:500px){.container{padding-top:35px}.stickers{font-size:32px;letter-spacing:5px}}
</style>
</head>
